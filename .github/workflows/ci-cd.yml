name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read
  security-events: write

env:
  GCP_PROJECT_ID: nexuscomm-487512
  GCP_REGION: europe-west2
  ARTIFACT_REGISTRY: europe-west2-docker.pkg.dev/nexuscomm-487512/nexuscomm

jobs:
  # Backend Tests and Linting
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run linting
        run: npm --prefix backend run lint
        continue-on-error: true

      - name: Build
        run: npm --prefix backend run build

      - name: Run tests
        run: npm --prefix backend run test:coverage
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test_db
        continue-on-error: true

  # Frontend Tests and Linting
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run linting
        run: npm --prefix web run lint
        continue-on-error: true

      - name: Build
        run: npm --prefix web run build

      - name: Run tests
        run: npm --prefix web run test:coverage
        continue-on-error: true

  # Docker Build and Push to GCP Artifact Registry
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ARTIFACT_REGISTRY }}/backend:${{ github.sha }}
            ${{ env.ARTIFACT_REGISTRY }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.ARTIFACT_REGISTRY }}/frontend:${{ github.sha }}
            ${{ env.ARTIFACT_REGISTRY }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Security Scanning
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  # Deploy to Cloud Run
  deploy:
    needs: [docker, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend to Cloud Run
        id: deploy-backend
        run: |
          gcloud run deploy nexuscomm-backend \
            --image ${{ env.ARTIFACT_REGISTRY }}/backend:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production" \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars "REDIS_URL=${{ secrets.REDIS_URL }}" \
            --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --set-env-vars "WEAVIATE_URL=${{ secrets.WEAVIATE_URL }}" \
            --set-env-vars "WEAVIATE_API_KEY=${{ secrets.WEAVIATE_API_KEY }}" \
            --set-env-vars "CLIENT_URL=https://nexuscomm-frontend-*.a.run.app" \
            --memory 512Mi \
            --cpu 1 \
            --quiet

          BACKEND_URL=$(gcloud run services describe nexuscomm-backend \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --format 'value(status.url)')
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "Backend deployed to: $BACKEND_URL"

      - name: Deploy frontend to Cloud Run
        id: deploy-frontend
        run: |
          gcloud run deploy nexuscomm-frontend \
            --image ${{ env.ARTIFACT_REGISTRY }}/frontend:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "API_URL=${{ steps.deploy-backend.outputs.backend_url }}" \
            --memory 512Mi \
            --cpu 1 \
            --quiet

          FRONTEND_URL=$(gcloud run services describe nexuscomm-frontend \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --format 'value(status.url)')
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "Frontend deployed to: $FRONTEND_URL"

      - name: Deployment summary
        run: |
          echo "## Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Backend:** ${{ steps.deploy-backend.outputs.backend_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Frontend:** ${{ steps.deploy-frontend.outputs.frontend_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image tag:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
